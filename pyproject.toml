[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-notes-rag"
version = "0.1.0"
description = "A study bot that answers questions from your own course notes, with citations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-dotenv"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
notesbot = "course_notes_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
